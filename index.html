<!-- ============ Navbar ============ -->
<nav class="navbar sticky-top bg-white navbar-expand-xxl border-subtle px-3 px-md-5 mb-3">
 <div class="container-fluid p-0">
  <a class="navbar-brand m-0" href="#/"><img src="img/My.Menu.logo.png" alt="My Menu"></a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll" aria-controls="navbarScroll" aria-expanded="false" data-i18n-aria-label="toggle">
   <div class="container" id="tgIcon"><div class="bar1"></div><div class="bar2"></div><div class="bar3"></div></div>
  </button>
  <div class="collapse navbar-collapse" id="navbarScroll">
   <ul class="navbar-nav ms-auto mb-2 pe-4 my-auto d-flex align-items-center flex-row">
    <li class="nav-item"><a class="nav-link navitemhover text-sec p-f1" data-route="home" href="#/" data-i18n="home"></a></li>
    <li class="nav-item"><a class="nav-link navitemhover text-sec p-f1" data-route="branches" href="#/branches" data-i18n="branches"></a></li>
    <li class="nav-item"><a class="nav-link navitemhover text-sec p-f1" data-route="about" href="#/about" data-i18n="about"></a></li>
   </ul>
   <ul class="navbar-nav m-0 gap-3 list-unstyled flex-wrap d-flex align-items-xxl-center flex-row pe-4">
    <li class="dropdown">
     <button type="button" class="dropdown-btn-f d-flex align-items-start gap-2" data-bs-toggle="dropdown" aria-expanded="false">
      <i class="fa-solid fa-location-dot mt-1" style="color:var(--Secondry-500)"></i>
      <span><span class="d-block" id="locTitle"></span><span class="d-block fsz-14" id="locSub" data-i18n="locsub"></span></span>
      <i class="fa-solid fa-angle-down mt-1"></i>
     </button>
     <ul class="dropdown-menu" id="cityMenu"></ul>
    </li>
    <li class="d-flex align-items-center gap-3">
     <a href="#/favorites" class="btn position-relative bg-sec hov p-f7 rounded-circle" data-i18n-aria-label="favs" data-i18n-title="favs">
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger-f"><span class="inter" id="favBadge">0</span></span>
      <i class="fa-regular fa-heart px-1"></i>
     </a>
     <div class="dropdown">
      <button type="button" class="btn position-relative bg-sec p-f7 hov rounded-circle" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" data-i18n-aria-label="cart" data-i18n-title="cart">
       <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger-f"><span class="inter" id="cartBadge">0</span></span>
       <i class="fa-solid fa-cart-shopping px-1"></i>
      </button>
      <div class="dropdown-menu dropdown-menu-end mt-4 p-fa2 border-subtle-2 cart-menu" id="cartMenu"></div>
     </div>
    </li>
    <li class="d-flex align-items-center flex-wrap gap-3">
     <button type="button" class="btn btn-pr-log-f" id="authBtn" data-i18n="login"></button>
     <div class="dropdown">
      <button type="button" class="dropbtn w-100" data-bs-toggle="dropdown" aria-expanded="false" data-i18n-aria-label="lang"><i class="fa-solid fa-globe"></i> <span id="langLabel">عربي</span> <i class="fa-solid fa-angle-down"></i></button>
      <div class="dropdown-menu text-center">
       <a class="dropdown-item" href="#" data-act="lang" data-lang="ar">عربي</a>
       <a class="dropdown-item" href="#" data-act="lang" data-lang="en">English</a>
      </div>
     </div>
    </li>
   </ul>
  </div>
 </div>
</nav>

<!-- ============ Login / Register modal ============ -->
<div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="mTitle" aria-hidden="true">
 <div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="p-4">
  <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-aria-label="close"></button>
  <div class="mx-auto d-flex justify-content-center flex-column align-items-center gap-3">
   <img src="img/My.Menu.logo.log.png" alt="">
   <div class="text-center">
    <p class="fsz-24 m-0 fw-700 text-black-f2" id="mTitle" data-i18n="m_title"></p>
    <p class="fsz-16 m-0 fw-400 text-sec" data-i18n="m_sub"></p>
   </div>
   <form id="authForm" class="d-flex flex-column gap-4 w-100" novalidate>
    <div class="d-flex flex-column gap-2 w-100">
     <button type="button" disabled class="border-subtle-2 border-rad-12 w-100 p-f8 bg-transparent fsz-16 text-sec"><i class="fa-brands fa-facebook" style="color:#1877F2"></i> <span data-i18n="fb"></span></button>
     <button type="button" disabled class="border-subtle-2 border-rad-12 w-100 p-f8 bg-transparent fsz-16 text-sec"><i class="fa-brands fa-google" style="color:#DB4437"></i> <span data-i18n="gg"></span></button>
    </div>
    <div class="fsz-14 fw-500 text-black text-center row align-items-center w-100 mx-0">
     <hr class="col-4 m-0"><span class="col-4" data-i18n="or"></span><hr class="col-4 m-0">
    </div>
    <div class="d-flex flex-column align-items-start gap-2">
     <label for="email" class="fw-500 fsz-16 text-black-f" data-i18n="email_l"></label>
     <div class="w-100 position-relative form-control border-rad-12 p-f9">
      <input type="email" class="border-none modalform-control" id="email" autocomplete="email" data-i18n-placeholder="email_p">
      <i class="fa-regular fa-envelope field-icon fsz-14 text-pr"></i>
     </div>
     <div class="text-danger fsz-14" id="eEmail" data-i18n="err_email" hidden></div>
    </div>
    <div class="d-flex flex-column align-items-start gap-2">
     <label for="password" class="fw-500 fsz-16 text-black-f" data-i18n="pw_l"></label>
     <div class="w-100 position-relative form-control border-rad-12 p-f9">
      <input type="password" class="border-none modalform-control" id="password" autocomplete="current-password" data-i18n-placeholder="pw_p">
      <button type="button" class="eye-btn field-icon p-0" id="eye" data-i18n-aria-label="showpw"><i class="fa-regular fa-eye-slash fsz-14 text-pr"></i></button>
     </div>
     <div class="text-danger fsz-14" id="ePw" data-i18n="err_pw" hidden></div>
    </div>
    <div class="d-flex align-items-center justify-content-between gap-2">
     <div><input type="checkbox" class="form-check-input-f" id="remember"> <label class="fsz-14 fw-500 text-black-f" for="remember" data-i18n="remember"></label></div>
     <a href="#/page/forgot" data-bs-dismiss="modal" class="fsz-14 fw-500 text-pr text-decoration-none" data-i18n="forgot"></a>
    </div>
    <div class="d-flex justify-content-center align-items-center flex-column gap-3">
     <button type="submit" class="btn btn-pr-log-f p-f8 fsz-14 fw-400 w-100" id="mBtn" data-i18n="login"></button>
     <div><span class="text-sec fsz-16" id="mAsk" data-i18n="noacc"></span> <a href="#" class="fsz-16 text-pr text-decoration-none" id="mSwitch" data-i18n="signup"></a></div>
    </div>
   </form>
  </div>
 </div></div></div>
</div>

<main id="app"></main>
